server:
  port: 8081 # Puerto único
spring:
  application:
    name: PRODUCT-SERVICE # Nombre para Eureka (MAYÚSCULAS consistente)
  datasource:
    url: jdbc:mysql://localhost:3306/db_product_service?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: polyglot_user
    password: polyglot_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
management:
  endpoints:
    web:
      exposure:
        include: health,info